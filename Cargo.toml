[package]
name    = "micropay-contracts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units    = 1
debug            = 0
debug-assertions = false
lto              = true
opt-level        = "z"
overflow-checks  = true
panic            = "abort"
strip            = "symbols"

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "20.0.0", features = [] }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
